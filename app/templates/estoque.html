<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#193d32">
    <title>Estoque | Produtos</title>
    <link rel="stylesheet" href="../static/css/estoque.css">
    <script src="../static/js/estoque.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Estoque, início">
            <span class="brand-mark" aria-hidden="true">I</span>
            <span>Armazém</span>
        </a>
        <span class="topbar-label">PAINEL DE CONTROLE</span>
    </header>

    <main class="workspace">
        <section class="page-heading" aria-labelledby="page-title">
            <div>
                <h1 id="page-title">Produtos</h1>
                <p class="page-description">Acompanhe e organize os itens do seu estoque.</p>
            </div>
            <div class="inventory-total" aria-live="polite">
                <span class="total-number" id="product-count">—</span>
                <span class="total-label">itens ativos</span>
            </div>
        </section>

        <div class="workspace-grid">
            <aside class="form-panel" aria-labelledby="form-title">
                <div class="panel-heading">
                    <p class="eyebrow" id="form-mode">NOVO ITEM</p>
                    <h2 id="form-title">Adicionar produto</h2>
                </div>
                <form id="product-form" novalidate>
                    <label for="categoria">Categoria</label>
                    <input id="categoria" name="categoria" type="text" autocomplete="off" required>
                    <p class="field-error" id="categoria-error"></p>

                    <label for="nome">Nome do produto</label>
                    <input id="nome" name="nome" type="text" autocomplete="off" minlength="3" required>
                    <p class="field-error" id="nome-error"></p>

                    <label for="quantidade">Quantidade</label>
                    <input id="quantidade" name="quantidade" type="text" autocomplete="off" required>
                    <p class="field-error" id="quantidade-error"></p>

                    <div class="form-actions">
                        <button class="button button-primary" id="submit-button" type="submit">Adicionar produto</button>
                        <button class="button button-quiet" id="cancel-edit" type="button" hidden>Cancelar</button>
                    </div>
                </form>
            </aside>

            <section class="products-section" aria-labelledby="list-title">
                <div class="list-heading">
                    <div>
                        <p class="eyebrow">VISÃO GERAL</p>
                        <h2 id="list-title">Estoque atual</h2>
                    </div>
                    <div class="list-tools">
                        <label class="search-box" for="product-search">
                            <span class="search-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Buscar produtos</span>
                            <input id="product-search" type="search" placeholder="Buscar produto..." autocomplete="off">
                        </label>
                        <button class="button button-export" id="download-spreadsheet" type="button">Baixar planilha</button>
                    </div>
                </div>
                <div id="notice" class="notice" role="status" aria-live="polite"></div>
                <ul class="product-list" id="product-list" aria-live="polite" aria-busy="true">
                    <li class="list-state">Carregando produtos...</li>
                </ul>
            </section>
        </div>
        <footer class="page-footer">
            <span>ESTOQUE</span>
            <span>Gestão simples, controle em dia.</span>
        </footer>
    </main>
</body>
</html>
